# Integration tests only. Never interpolate DB_NAME — that is the runtime database
# (`v_beta`) and is often exported in the same shell as `./mvnw spring-boot:run`.
spring.datasource.url=jdbc:postgresql://${TEST_DB_HOST:${DB_HOST:127.0.0.1}}:${TEST_DB_PORT:${DB_PORT:5432}}/${TEST_DB_NAME:v_beta_test}
spring.datasource.username=${TEST_SQL_USERNAME:${SQL_USERNAME:postgres}}
spring.datasource.password=${TEST_SQL_PASSWORD:${SQL_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
