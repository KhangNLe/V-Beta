# Integration tests only. Do not fall back to DB_* / SQL_* — those come from
# server/.env (runtime app: v_beta on 5432) and would hijack `./mvnw test`.
# Local default matches scripts/test-with-postgres.sh (Docker on 55432).
# CI sets TEST_DB_PORT=5432 for the GitHub Postgres service.
spring.datasource.url=jdbc:postgresql://${TEST_DB_HOST:127.0.0.1}:${TEST_DB_PORT:55432}/${TEST_DB_NAME:v_beta_test}
spring.datasource.username=${TEST_SQL_USERNAME:postgres}
spring.datasource.password=${TEST_SQL_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
