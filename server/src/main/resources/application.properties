spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DB:V_Beta}?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${SQL_USERNAME}
spring.datasource.password=${SQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:./firebase-credentials.json}

spring.cloud.gcp.project-id=${GCP_PROJECT_ID:None}
spring.cloud.gcp.credentials.location=file:${GOOGLE_SERVICE_CREDENTIALS_PATH:./google-account-credential.json}

app.public-bucket-name=${STORAGE_PUBLIC_BUCKET_NAME:None}
gcp.signed-url.expiration-minutes=5