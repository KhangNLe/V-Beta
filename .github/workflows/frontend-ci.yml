name: Frontend CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Frontend (Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: v-beta/package-lock.json

      - name: Install dependencies
        working-directory: v-beta
        run: npm ci

      - name: Run tests
        working-directory: v-beta
        run: npm test -- --watchAll=false
